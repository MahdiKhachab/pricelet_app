buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// sqlite3_flutter_libs compiles against SDK 35, which the aapt2 bundled with
// AGP 7.x cannot read. It uses no SDK 35 APIs, so build it against 34.
// Remove once the project moves to AGP 8.
subprojects {
    afterEvaluate { project ->
        if (project.name == 'sqlite3_flutter_libs' && project.hasProperty('android')) {
            project.android.compileSdkVersion 34
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
