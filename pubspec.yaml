name: pricelet_app
description: Pricelet - point of sale for small retail shops.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  floor: ^1.4.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6
  flutter_barcode_scanner: ^2.0.0
  intl: ^0.18.1
  pdf: 3.10.8
  printing: 5.12.0
  crypto: ^3.0.7
  collection: ^1.18.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.5
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  floor_generator: ^1.4.2
  build_runner: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: 0.13.1

flutter:
  assets:
    - assets/images/
    - assets/icon/
  uses-material-design: true
